<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;}
#c{display:block;width:100vw;height:100vh;}

/* ── HUD ── */
#hud{position:fixed;top:0;left:0;right:0;z-index:30;pointer-events:none;}
#hud-bar{
  background:linear-gradient(to bottom,rgba(0,0,0,0.92),rgba(0,0,0,0.7));
  padding:8px 16px 6px;display:flex;align-items:center;gap:14px;
  border-bottom:1px solid #0a1a2a;
}
.hlbl{color:#37474f;font-size:9px;letter-spacing:1px;text-transform:uppercase;}
.bwrap{display:flex;align-items:center;gap:5px;}
.bbg{width:85px;height:7px;background:#080810;border-radius:1px;overflow:hidden;}
.bfill{height:100%;border-radius:1px;transition:width .15s;}
#bHP{background:#2e7d32;} #bEX{background:#4527a0;}
#tHP{color:#ef9a9a;font-size:10px;min-width:52px;}
#tST{color:#546e7a;font-size:10px;}
#tFL{color:#00bcd4;font-size:11px;font-weight:bold;margin-left:4px;}
#tCD{font-size:10px;min-width:120px;}

/* ── 크로스헤어 ── */
#xh{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    width:18px;height:18px;pointer-events:none;z-index:20;}
#xh::before,#xh::after{content:'';position:absolute;background:rgba(0,229,255,0.6);border-radius:1px;}
#xh::before{width:2px;height:18px;left:8px;top:0;}
#xh::after{width:18px;height:2px;top:8px;left:0;}

/* ── 오른쪽 패널 ── */
#panel{position:fixed;top:50px;right:14px;z-index:30;pointer-events:none;display:flex;flex-direction:column;gap:10px;}

/* 나침반 */
#compass{
  background:rgba(0,4,12,0.88);
  border:1px solid #0a2030;
  border-radius:4px;padding:8px;width:110px;
}
#compass-title{color:#37474f;font-size:9px;letter-spacing:2px;text-align:center;margin-bottom:6px;}
#compass-svg-wrap{display:flex;justify-content:center;}
#compass-svg{width:88px;height:88px;}
#c-dist{color:#f9a825;font-size:10px;text-align:center;margin-top:5px;letter-spacing:1px;}
#c-found{color:#37474f;font-size:9px;text-align:center;margin-top:2px;}

/* 미니맵 */
#mmbox{
  background:rgba(0,4,12,0.88);
  border:1px solid #0a2030;
  border-radius:4px;padding:8px;
}
#mm-title{color:#37474f;font-size:9px;letter-spacing:2px;text-align:center;margin-bottom:6px;}
#mm{border:1px solid #0a2030;image-rendering:pixelated;display:block;}

/* ── 메시지/데미지 ── */
#msgs{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:30;pointer-events:none;text-align:center;}
.gm{font-size:14px;background:rgba(0,0,0,0.78);padding:4px 16px;border-radius:3px;margin:2px auto;display:inline-block;font-weight:bold;}
.dn{position:fixed;pointer-events:none;z-index:30;font-size:15px;font-weight:bold;text-shadow:0 0 6px #000;}

/* ── 오버레이 ── */
#ov{position:fixed;inset:0;background:rgba(0,0,8,0.97);z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
#ov h1{color:#00e5ff;font-size:36px;letter-spacing:4px;margin-bottom:6px;text-shadow:0 0 40px #00e5ff44;}
.ov-sub{color:#263238;font-size:11px;letter-spacing:3px;margin-bottom:30px;}
.ov-keys{
  color:#546e7a;font-size:11px;line-height:2.3;
  border-left:2px solid #002030;padding-left:18px;margin-bottom:28px;
}
.ov-keys b{color:#80cbc4;}
.ov-btn{color:#f9a825;font-size:13px;cursor:pointer;letter-spacing:2px;animation:bk 1.2s ease-in-out infinite;}
@keyframes bk{0%,100%{opacity:1}50%{opacity:0.2}}

#hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
      color:#1a2a3a;font-size:10px;letter-spacing:1px;z-index:20;pointer-events:none;}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="xh"></div>

<!-- HUD -->
<div id="hud">
  <div id="hud-bar">
    <div class="bwrap"><span class="hlbl">HP</span><div class="bbg"><div class="bfill" id="bHP" style="width:100%"></div></div><span id="tHP">30/30</span></div>

<!-- 우측 패널 -->
<div id="panel">

  <!-- 미니맵 -->
  <div id="mmbox">

</div>

<!-- 메시지 -->
<div id="msgs"></div>
<div id="hint">WASD/방향키 이동 | 마우스 시점 | SPACE 스캔 | E 공격</div>

<!-- 타이틀 -->
<div id="ov">
  <h1>던전 메아리</h1>

<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script>
// ══════════════════════════════════════════════════
// 오디오
// ══════════════════════════════════════════════════
let _ac;
function gac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
function beep(f,t,d,v,a=0.004){
  try{const c=gac(),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.type=t;o.frequency.value=f;
  const ct=c.currentTime;
  g.gain.setValueAtTime(0,ct);g.gain.linearRampToValueAtTime(v,ct+a);
  g.gain.exponentialRampToValueAtTime(0.001,ct+d);o.start();o.stop(ct+d+0.05);}catch(e){}
}
const SFX={
  scan:()=>{beep(700,'sine',1.2,0.2,0.003);setTimeout(()=>beep(350,'sine',0.9,0.07),110);},
  step:()=>beep(70+Math.random()*25,'sawtooth',0.05,0.03,0.001),
  hit: ()=>{beep(170,'square',0.09,0.3,0.001);beep(110,'sawtooth',0.08,0.22,0.001);},
  hurt:()=>beep(140,'square',0.22,0.42,0.001),
  lvl: ()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,'square',0.2,0.18),i*90)),
  pick:()=>{beep(880,'sine',0.1,0.2);setTimeout(()=>beep(1320,'sine',0.1,0.16),60);},
};

// ══════════════════════════════════════════════════
// BSP 던전
// ══════════════════════════════════════════════════
class Dungeon{
  constructor(w=54,h=44){this.w=w;this.h=h;this.rooms=[];this.grid=[];}
  generate(){
    this.grid=Array.from({length:this.h},()=>Array(this.w).fill(0));
    this._bsp({x:1,y:1,w:this.w-2,h:this.h-2},0).forEach(l=>{
      const r=this._mkRoom(l);if(r){this._carve(r);this.rooms.push(r);}
    });
    for(let i=1;i<this.rooms.length;i++)this._connect(this.rooms[i-1],this.rooms[i]);
    const last=this.rooms[this.rooms.length-1];
    this.stairX=last.x+Math.floor(last.w/2);
    this.stairY=last.y+Math.floor(last.h/2);
    this.grid[this.stairY][this.stairX]=3;
    return this;
  }
  _bsp(n,d){
    const min=8;
    if(d>5||(n.w<min*2&&n.h<min*2))return[n];
    if(n.h>n.w&&n.h>=min*2){const s=min+Math.floor(Math.random()*(n.h-min*2));return[...this._bsp({x:n.x,y:n.y,w:n.w,h:s},d+1),...this._bsp({x:n.x,y:n.y+s,w:n.w,h:n.h-s},d+1)];}
    if(n.w>=min*2){const s=min+Math.floor(Math.random()*(n.w-min*2));return[...this._bsp({x:n.x,y:n.y,w:s,h:n.h},d+1),...this._bsp({x:n.x+s,y:n.y,w:n.w-s,h:n.h},d+1)];}
    return[n];
  }
  _mkRoom(l){
    const mw=Math.min(12,l.w-2),mh=Math.min(12,l.h-2);
    if(mw<4||mh<4)return null;
    const w=5+Math.floor(Math.random()*(mw-4)),h=5+Math.floor(Math.random()*(mh-4));
    return{x:l.x+1+Math.floor(Math.random()*(l.w-w-1)),y:l.y+1+Math.floor(Math.random()*(l.h-h-1)),w,h};
  }
  _carve(r){for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)this.grid[y][x]=1;}
  _connect(a,b){
    const ax=a.x+Math.floor(a.w/2),ay=a.y+Math.floor(a.h/2);
    const bx=b.x+Math.floor(b.w/2),by=b.y+Math.floor(b.h/2);
    if(Math.random()<0.5){this._hc(ax,bx,ay);this._vc(ay,by,bx);}
    else{this._vc(ay,by,ax);this._hc(ax,bx,by);}
  }
  _hc(x1,x2,y){for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)if(y>0&&y<this.h-1)this.grid[y][x]=1;}
  _vc(y1,y2,x){for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)if(x>0&&x<this.w-1)this.grid[y][x]=1;}
  walkable(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h&&this.grid[y]?.[x]!==0;}
  start(){const r=this.rooms[0];return{x:r.x+Math.floor(r.w/2),y:r.y+Math.floor(r.h/2)};}
}

// ══════════════════════════════════════════════════
// Three.js 초기화
// ══════════════════════════════════════════════════
const TS=22,WH=20,EYE=WH*0.52;
// 포그 설정: 평소=어두움, 스캔=환해짐
const FOG_DARK=0.030;  // 평소: 2타일 거리 이상 거의 안보임
const FOG_SCAN=0.0012; // 스캔: 전체 던전 보임

const renderer=new THREE.WebGLRenderer({
  canvas:document.getElementById('c'),
  antialias:false,
  preserveDrawingBuffer:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000005);
scene.fog=new THREE.FogExp2(0x000008,FOG_DARK);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.5,600);
camera.rotation.order='YXZ';

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

// ─── 머티리얼: MeshBasicMaterial 사용 → 조명 불필요, 포그만으로 어둠 제어 ───
// 색상을 충분히 밝게 설정해야 포그가 걷히면 바로 보임
const MWALL=new THREE.MeshBasicMaterial({color:0x3a3a6e});   // 벽: 중간 파란빛
const MFLOOR=new THREE.MeshBasicMaterial({color:0x28284e});  // 바닥: 조금 더 어둡게
const MCEIL=new THREE.MeshBasicMaterial({color:0x141426});   // 천장: 어두움
const MSTAIR=new THREE.MeshBasicMaterial({color:0xf9a825});  // 계단: 금색

// 포인트 라이트는 Emissive 오브젝트(적, 아이템)에 영향
// 던전 기하학엔 BasicMaterial이라 빛 영향 없음

// ══════════════════════════════════════════════════
// 게임 상태
// ══════════════════════════════════════════════════
let GS='title';
let floorN=1;
let px=0,pz=0,yaw=0;
let P={hp:30,maxHp:30,atk:6,def:1,lv:1,exp:0,expNext:10,gold:0};
let dungeon,enemies=[],items=[],waves=[];
let sceneObjs=[];
let scannedTiles=new Set();  // 'x,z' → 미니맵
let scannedEnemies=new Map();// enemy → ms timer
let exitFound=false;

let scanAnim={phase:0,t:0};
let scanCD=0;
const SCAN_CD_MS=2500;

let lastStep=0,mouseLocked=false,mouseDrag=false,lastMX=0;
const keys={};

// ══════════════════════════════════════════════════
// 게임 초기화
// ══════════════════════════════════════════════════
function initGame(savedP){
  sceneObjs.forEach(o=>scene.remove(o));
  sceneObjs=[];
  enemies=[]; items=[]; waves=[];
  scannedTiles=new Set(); scannedEnemies=new Map();
  exitFound=false; scanAnim={phase:0,t:0};

  dungeon=new Dungeon(54,44).generate();
  const s=dungeon.start();
  px=s.x*TS+TS/2; pz=s.y*TS+TS/2;
  if(savedP) Object.assign(P,savedP);
  yaw=0;

  buildDungeon();
  spawnEnemies();
  spawnItems();
  scene.fog.density=FOG_DARK;
  camera.position.set(px,EYE,pz);
  camera.rotation.set(0,0,0,'YXZ');

  // 작은 주변광 — BasicMaterial에 영향없지만 Emissive 오브젝트에 영향
  if(!scene.getObjectByName('amb')){
    const a=new THREE.AmbientLight(0x111122,1.0);a.name='amb';scene.add(a);
  }

  msg(`B${floorN}F — 어둠 속으로`,{color:'#00e5ff',dur:2200});
  setTimeout(()=>emitScan(14),600);
}

// ══════════════════════════════════════════════════
// 던전 메시 (InstancedMesh + BasicMaterial)
// ══════════════════════════════════════════════════
function buildDungeon(){
  const {w,h,grid}=dungeon;
  let fc=0,cc=0,wc=0;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(grid[y][x]!==0){fc++;cc++;}
    else if([[0,1],[0,-1],[1,0],[-1,0]].some(([dy,dx])=>grid[y+dy]?.[x+dx]!==0))wc++;
  }
  const fG=new THREE.BoxGeometry(TS,0.6,TS);
  const wG=new THREE.BoxGeometry(TS,WH,TS);
  const fM=new THREE.InstancedMesh(fG,MFLOOR,fc);
  const cM=new THREE.InstancedMesh(fG,MCEIL,cc);
  const wM=new THREE.InstancedMesh(wG,MWALL,Math.max(1,wc));
  const m4=new THREE.Matrix4();
  let fi=0,ci=0,wi=0;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const wx=x*TS+TS/2,wz=y*TS+TS/2;
    if(grid[y][x]!==0){
      m4.makeTranslation(wx,0.3,wz);fM.setMatrixAt(fi++,m4);
      m4.makeTranslation(wx,WH+0.3,wz);cM.setMatrixAt(ci++,m4);
    } else if([[0,1],[0,-1],[1,0],[-1,0]].some(([dy,dx])=>grid[y+dy]?.[x+dx]!==0)){
      m4.makeTranslation(wx,WH/2,wz);wM.setMatrixAt(wi++,m4);
    }
  }
  fM.instanceMatrix.needsUpdate=true;
  cM.instanceMatrix.needsUpdate=true;
  wM.instanceMatrix.needsUpdate=true;
  scene.add(fM,cM,wM); sceneObjs.push(fM,cM,wM);

  // 계단
  const sm=new THREE.Mesh(new THREE.BoxGeometry(TS*0.5,1.6,TS*0.5),MSTAIR);
  sm.position.set(dungeon.stairX*TS+TS/2,1.4,dungeon.stairY*TS+TS/2);
  scene.add(sm); sceneObjs.push(sm);
  // 계단 조명
  const sl=new THREE.PointLight(0xf9a825,3.0,55);
  sl.position.set(dungeon.stairX*TS+TS/2,10,dungeon.stairY*TS+TS/2);
  scene.add(sl); sceneObjs.push(sl);
}

// ══════════════════════════════════════════════════
// 적 (LambertMaterial — 빛 반응, 조명으로 드라마틱 효과)
// ══════════════════════════════════════════════════
const ET=[
  {name:'슬라임', col:0x2e7d32,hp:8, atk:4, def:0,exp:4, spd:1100,sz:[8,8,8]},
  {name:'스켈레톤',col:0x9e9e9e,hp:16,atk:6, def:1,exp:9, spd:780, sz:[5,14,5]},
  {name:'박쥐',   col:0x6a1b9a,hp:7, atk:5, def:0,exp:6, spd:460, sz:[11,5,11]},
  {name:'골렘',   col:0x4e342e,hp:35,atk:11,def:3,exp:22,spd:1300,sz:[12,15,12]},
];
function mkEG(t){
  const g=new THREE.Group();
  const mat=new THREE.MeshLambertMaterial({color:t.col,emissive:new THREE.Color(t.col).multiplyScalar(0.3)});
  const[bw,bh]=t.sz;
  const body=new THREE.Mesh(new THREE.BoxGeometry(bw,bh*0.55,bw),mat);
  body.position.y=bh*0.28; g.add(body);
  const head=new THREE.Mesh(new THREE.BoxGeometry(bw*0.75,bw*0.75,bw*0.75),mat);
  head.position.y=bh*0.55+bw*0.38; g.add(head);
  const em=new THREE.MeshBasicMaterial({color:0xff1111});
  [-2,2].forEach(ox=>{const e=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.8,0.5),em);e.position.set(ox,bh*0.55+bw*0.42,bw*0.34);g.add(e);});
  return g;
}
function spawnEnemies(){
  const cnt=5+floorN*2, rooms=dungeon.rooms.slice(1);
  for(let i=0;i<Math.min(cnt,rooms.length*3);i++){
    const rm=rooms[i%rooms.length];
    const ex=rm.x+1+Math.floor(Math.random()*(rm.w-2));
    const ey=rm.y+1+Math.floor(Math.random()*(rm.h-2));
    const t=ET[Math.min(Math.floor(i/2+(floorN-1)),ET.length-1)%ET.length];
    const grp=mkEG(t);
    grp.position.set(ex*TS+TS/2,0,ey*TS+TS/2);
    grp.visible=false;
    scene.add(grp); sceneObjs.push(grp);
    enemies.push({...t,x:ex,y:ey,alive:true,grp,
      hp:t.hp+(floorN-1)*4,visTimer:0,alertTimer:0,state:'idle',
      lastMove:Math.random()*t.spd,tx:ex*TS+TS/2,tz:ey*TS+TS/2});
  }
}

// ══════════════════════════════════════════════════
// 아이템
// ══════════════════════════════════════════════════
function spawnItems(){
  dungeon.rooms.slice(2,8).forEach(rm=>{
    if(Math.random()>0.75)return;
    const ix=rm.x+1+Math.floor(Math.random()*(rm.w-2));
    const iy=rm.y+1+Math.floor(Math.random()*(rm.h-2));
    const type=Math.random()<0.6?'potion':'relic';
    const col=type==='potion'?0xe91e63:0xffd700;
    const mat=new THREE.MeshLambertMaterial({color:col,emissive:col,emissiveIntensity:0.8});
    const mesh=new THREE.Mesh(new THREE.CylinderGeometry(3,3,8,8),mat);
    mesh.position.set(ix*TS+TS/2,5,iy*TS+TS/2);
    mesh.visible=false;
    scene.add(mesh); sceneObjs.push(mesh);
    const il=new THREE.PointLight(col,2.0,40);
    il.position.set(ix*TS+TS/2,10,iy*TS+TS/2);
    il.visible=false;
    scene.add(il); sceneObjs.push(il);
    items.push({x:ix,y:iy,type,mesh,light:il,got:false});
  });
}

// ══════════════════════════════════════════════════
// 음파 스캔 — 핵심 메카닉
// ══════════════════════════════════════════════════
function emitScan(radius=14){
  // 3D 와이어프레임 구체
  const geo=new THREE.SphereGeometry(1,24,16);
  const mat=new THREE.MeshBasicMaterial({color:0x00e5ff,wireframe:true,transparent:true,opacity:0.7});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(px,EYE*0.5,pz);
  scene.add(mesh); sceneObjs.push(mesh);

  // 파동과 함께 움직이는 포인트라이트 (적/아이템 조명)
  const fl=new THREE.PointLight(0x00e5ff,8,50);
  fl.position.copy(mesh.position);
  scene.add(fl); sceneObjs.push(fl);

  waves.push({mesh,fl,r:0.5,max:radius*TS,spd:TS*5.5,alpha:0.7,ox:px,oz:pz});

  // ★ 핵심: 포그 걷어내는 애니메이션 시작
  scanAnim={phase:1,t:0};
  scanCD=SCAN_CD_MS;
  SFX.scan();
}

function updateScan(dt){
  if(scanCD>0) scanCD=Math.max(0,scanCD-dt*1000);

  // 포그 & 색조 애니메이션 (Perception 스타일)
  const sa=scanAnim;
  if(sa.phase===1){          // ← 빠르게 밝아짐 (0.3s)
    sa.t+=dt;
    const p=Math.min(1,sa.t/0.3);
    scene.fog.density=FOG_DARK+(FOG_SCAN-FOG_DARK)*(p*p); // ease-in
    if(sa.t>=0.3){sa.phase=2;sa.t=0;}
  } else if(sa.phase===2){   // ← 유지 (0.5s): 이때 던전 구조 파악
    sa.t+=dt;
    scene.fog.density=FOG_SCAN;
    if(sa.t>=0.5){sa.phase=3;sa.t=0;}
  } else if(sa.phase===3){   // ← 천천히 다시 어두워짐 (2.5s)
    sa.t+=dt;
    const p=Math.min(1,sa.t/2.5);
    scene.fog.density=FOG_SCAN+(FOG_DARK-FOG_SCAN)*p;
    if(sa.t>=2.5){sa.phase=0;scene.fog.density=FOG_DARK;}
  }

  // 파동 오브젝트 업데이트
  const dead=[];
  for(const w of waves){
    w.r+=w.spd*dt;
    w.mesh.scale.setScalar(w.r);
    const fade=Math.max(0,1-w.r/w.max);
    w.mesh.material.opacity=w.alpha*fade*0.65;
    w.fl.intensity=8*fade;
    w.fl.distance=Math.min(w.r*0.5,120);

    // 파동 링이 지나가는 타일 → 미니맵에 기록
    const ri=Math.ceil(w.r/TS)+2;
    const cx=Math.floor(w.ox/TS), cz=Math.floor(w.oz/TS);
    for(let dz=-ri;dz<=ri;dz++) for(let dx=-ri;dx<=ri;dx++){
      const tx=cx+dx, tz=cz+dz;
      const d2=Math.sqrt(dx*dx+dz*dz)*TS;
      if(d2>=w.r-TS*2&&d2<=w.r+TS&&tx>=0&&tz>=0&&tx<dungeon.w&&tz<dungeon.h){
        scannedTiles.add(`${tx},${tz}`);
        if(tx===dungeon.stairX&&tz===dungeon.stairY) exitFound=true;
      }
    }
    // 적 탐지
    for(const e of enemies){
      if(!e.alive)continue;
      const d=Math.hypot(e.x*TS+TS/2-w.ox,e.y*TS+TS/2-w.oz);
      if(d>=w.r-TS*2&&d<=w.r+TS){
        scannedEnemies.set(e,4500);
        e.state='chase'; e.alertTimer=6000;
      }
    }
    if(w.r>=w.max) dead.push(w);
  }
  dead.forEach(w=>{scene.remove(w.mesh,w.fl);waves.splice(waves.indexOf(w),1);});
}

// ══════════════════════════════════════════════════
// 미니맵
// ══════════════════════════════════════════════════
const mmEl=document.getElementById('mm');
const mmCtx=mmEl.getContext('2d');
const MMW=136,MMH=110;

function drawMinimap(){
  if(!dungeon)return;
  mmCtx.fillStyle='#010408'; mmCtx.fillRect(0,0,MMW,MMH);
  const scx=MMW/dungeon.w, scz=MMH/dungeon.h;

  // 스캔된 타일
  for(const key of scannedTiles){
    const[tx,tz]=key.split(',').map(Number);
    const t=dungeon.grid[tz]?.[tx];
    if(t===undefined)continue;
    if(t===0)       mmCtx.fillStyle='#0d1a28';
    else if(t===3)  mmCtx.fillStyle='#f9a825';
    else            mmCtx.fillStyle='#2a3060';
    const fw=Math.max(1.2,scx), fh=Math.max(1.2,scz);
    mmCtx.fillRect(tx*scx,tz*scz,fw,fh);
  }

  // 출구 마커 (발견됐을 때 강조)
  if(exitFound){
    const sx=dungeon.stairX*scx+scx/2, sz=dungeon.stairY*scz+scz/2;
    mmCtx.fillStyle='#f9a825';
    mmCtx.beginPath(); mmCtx.arc(sx,sz,4,0,Math.PI*2); mmCtx.fill();
    mmCtx.fillStyle='rgba(249,168,37,0.3)';
    mmCtx.beginPath(); mmCtx.arc(sx,sz,7,0,Math.PI*2); mmCtx.fill();
  }

  // 아이템
  for(const it of items){
    if(it.got||!scannedTiles.has(`${it.x},${it.y}`))continue;
    mmCtx.fillStyle=it.type==='potion'?'#e91e63':'#ffd700';
    mmCtx.beginPath(); mmCtx.arc(it.x*scx+scx/2,it.y*scz+scz/2,2.5,0,Math.PI*2); mmCtx.fill();
  }

  // 스캔된 적
  for(const[e,timer] of scannedEnemies){
    if(!e.alive)continue;
    const a=Math.min(1,timer/2000);
    mmCtx.fillStyle=`rgba(255,60,60,${a})`;
    mmCtx.beginPath(); mmCtx.arc(e.x*scx+scx/2,e.y*scz+scz/2,3,0,Math.PI*2); mmCtx.fill();
  }

  // 플레이어 위치 + 방향
  const ppx=px/TS*scx, ppz=pz/TS*scz;
  // 시야 부채꼴
  mmCtx.save();
  mmCtx.globalAlpha=0.15;
  mmCtx.fillStyle='#00e5ff';
  mmCtx.beginPath();
  mmCtx.moveTo(ppx,ppz);
  mmCtx.arc(ppx,ppz,16, Math.PI/2+yaw-0.55, Math.PI/2+yaw+0.55);
  mmCtx.lineTo(ppx,ppz); mmCtx.fill();
  mmCtx.globalAlpha=1;
  mmCtx.restore();

  // 플레이어 점
  mmCtx.fillStyle='#00e5ff';
  mmCtx.beginPath(); mmCtx.arc(ppx,ppz,3.5,0,Math.PI*2); mmCtx.fill();
  // 방향 화살
  const ax=ppx-Math.sin(yaw)*8, az=ppz-Math.cos(yaw)*8;
  mmCtx.strokeStyle='#00e5ff'; mmCtx.lineWidth=1.5;
  mmCtx.beginPath(); mmCtx.moveTo(ppx,ppz); mmCtx.lineTo(ax,az); mmCtx.stroke();
}

// ══════════════════════════════════════════════════
// 나침반
// ══════════════════════════════════════════════════
function updateCompass(){
  if(!dungeon)return;
  const sx=dungeon.stairX*TS+TS/2, sz=dungeon.stairY*TS+TS/2;
  const dx=sx-px, dz=sz-pz;
  const distTiles=Math.round(Math.sqrt(dx*dx+dz*dz)/TS);

  // 화살표 각도 (플레이어 yaw 기준)
  const worldAngle=Math.atan2(dx,dz);
  const relDeg=(worldAngle-yaw)*(180/Math.PI);

  const arrow=document.getElementById('exit-arrow');
  const hidden=document.getElementById('exit-hidden');

  arrow.setAttribute('transform',`rotate(${relDeg.toFixed(1)},44,44)`);

  if(exitFound){
    hidden.style.display='none';
    document.getElementById('c-dist').textContent=distTiles+'타일 거리';
    document.getElementById('c-dist').style.color='#f9a825';
    document.getElementById('c-found').textContent='출구 발견!';
    document.getElementById('c-found').style.color='#f9a825';
  } else {
    hidden.style.display='block';
    document.getElementById('c-dist').textContent='--- m';
    document.getElementById('c-dist').style.color='#263238';
    document.getElementById('c-found').textContent='스캔으로 탐색하세요';
    document.getElementById('c-found').style.color='#263238';
  }
}

// ══════════════════════════════════════════════════
// 입력
// ══════════════════════════════════════════════════
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(GS!=='playing')return;
  if(e.code==='Space'){e.preventDefault();if(scanCD<=0)emitScan(12+floorN);}
  if(e.code==='KeyE'||e.code==='KeyF')atk();
});
window.addEventListener('keyup',e=>keys[e.code]=false);

const cv=document.getElementById('c');
cv.addEventListener('click',()=>{if(GS==='playing')cv.requestPointerLock?.();});
document.addEventListener('pointerlockchange',()=>{mouseLocked=!!document.pointerLockElement;});
document.addEventListener('mousemove',e=>{
  if(GS!=='playing')return;
  if(mouseLocked){yaw-=e.movementX*0.002;}
  else if(mouseDrag){yaw-=(e.clientX-lastMX)*0.0035;lastMX=e.clientX;}
});
cv.addEventListener('mousedown',e=>{if(e.button===0&&GS==='playing'){mouseDrag=true;lastMX=e.clientX;atk();}});
window.addEventListener('mouseup',()=>mouseDrag=false);

// ══════════════════════════════════════════════════
// 전투
// ══════════════════════════════════════════════════
function atk(){
  const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  for(const e of enemies){
    if(!e.alive)continue;
    const ex=e.x*TS+TS/2,ez=e.y*TS+TS/2;
    const d=Math.hypot(ex-px,ez-pz);
    if(d>TS*2.0)continue;
    if(fwd.dot(new THREE.Vector3(ex-px,0,ez-pz).normalize())<0.4)continue;
    const dmg=Math.max(1,P.atk-e.def+Math.floor(Math.random()*4));
    e.hp-=dmg; SFX.hit(); dn('-'+dmg,'#ff5252');
    // 타격 소음 = 작은 파동
    if(scanCD<=0)emitScan(3);
    if(e.hp<=0){
      e.alive=false; e.grp.visible=false;
      P.exp+=e.exp; P.gold+=1+Math.floor(Math.random()*3);
      if(P.exp>=P.expNext) lvlUp();
    }
    return;
  }
  SFX.step();
}
function lvlUp(){
  P.lv++;P.exp-=P.expNext;P.expNext=Math.floor(P.expNext*1.75);
  P.maxHp+=8;P.hp=P.maxHp;P.atk+=2;
  SFX.lvl(); msg('LEVEL UP!  Lv.'+P.lv,{color:'#ffd700',dur:2000}); emitScan(16);
}

// ══════════════════════════════════════════════════
// 이동
// ══════════════════════════════════════════════════
function movePlayer(dt,now){
  const spd=60*dt,turn=2.0*dt;
  if(keys['ArrowLeft'])yaw+=turn;
  if(keys['ArrowRight'])yaw-=turn;
  const c=Math.cos(yaw),s=Math.sin(yaw);
  let nx=px,nz=pz;
  if(keys['KeyW']||keys['ArrowUp']){nx-=s*spd;nz-=c*spd;}
  if(keys['KeyS']||keys['ArrowDown']){nx+=s*spd;nz+=c*spd;}
  if(keys['KeyA']){nx-=c*spd;nz+=s*spd;}
  if(keys['KeyD']){nx+=c*spd;nz-=s*spd;}
  const m=TS*0.38;
  if(dungeon.walkable(Math.floor((nx+m)/TS),Math.floor(pz/TS))&&dungeon.walkable(Math.floor((nx-m)/TS),Math.floor(pz/TS)))px=nx;
  if(dungeon.walkable(Math.floor(px/TS),Math.floor((nz+m)/TS))&&dungeon.walkable(Math.floor(px/TS),Math.floor((nz-m)/TS)))pz=nz;
  camera.position.set(px,EYE,pz);
  camera.rotation.set(0,yaw,0,'YXZ');
  const mv=keys['KeyW']||keys['KeyS']||keys['KeyA']||keys['KeyD']||keys['ArrowUp']||keys['ArrowDown'];
  if(mv&&now-lastStep>280){SFX.step();lastStep=now;
    // 발소리 = 아주 작은 스캔 (현재 타일만)
    const tx=Math.floor(px/TS),tz=Math.floor(pz/TS);
    scannedTiles.add(`${tx},${tz}`);
    [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dz,dx])=>scannedTiles.add(`${tx+dx},${tz+dz}`));
  }
}

// ══════════════════════════════════════════════════
// 적 AI
// ══════════════════════════════════════════════════
function updateEnemies(dt,now){
  for(const e of enemies){
    if(!e.alive)continue;
    if(e.alertTimer>0) e.alertTimer-=dt*1000;
    const ep=e.x*TS+TS/2, eq=e.y*TS+TS/2;
    const pd=Math.hypot(ep-px,eq-pz);

    if(pd<TS*2){e.state='chase';e.alertTimer=4500;}
    if(e.alertTimer<=0) e.state='idle';

    if(scannedEnemies.has(e)){
      const t=Math.max(0,scannedEnemies.get(e)-dt*1000);
      if(t<=0)scannedEnemies.delete(e); else scannedEnemies.set(e,t);
    }
    const vis=pd<TS*3.5||scannedEnemies.has(e);
    e.grp.visible=vis;
    if(vis) e.grp.rotation.y=Math.atan2(px-ep,pz-eq);

    if(pd<TS*1.3&&now-e.lastMove>e.spd*0.5){
      const dmg=Math.max(1,e.atk-P.def);
      P.hp=Math.max(0,P.hp-dmg); SFX.hurt(); dn('-'+dmg,'#ffcc00');
      e.lastMove=now; continue;
    }
    if(e.state==='idle'||now-e.lastMove<e.spd)continue;
    e.lastMove=now;
    const dx=px-ep, dz2=pz-eq;
    const moves=Math.abs(dx)>Math.abs(dz2)?[[Math.sign(dx)|0,0],[0,Math.sign(dz2)|0]]:[[0,Math.sign(dz2)|0],[Math.sign(dx)|0,0]];
    moves.push([-1,0],[1,0],[0,-1],[0,1]);
    for(const[mx,mz]of moves){
      const nx=e.x+mx,nz=e.y+mz;
      if(dungeon.walkable(nx,nz)&&!enemies.some(o=>o!==e&&o.alive&&o.x===nx&&o.y===nz)){
        e.x=nx;e.y=nz;e.tx=nx*TS+TS/2;e.tz=nz*TS+TS/2;break;
      }
    }
  }
  for(const e of enemies){
    if(!e.alive)continue;
    e.grp.position.x+=(e.tx-e.grp.position.x)*Math.min(1,dt*7);
    e.grp.position.z+=(e.tz-e.grp.position.z)*Math.min(1,dt*7);
  }
}

// ══════════════════════════════════════════════════
// 아이템 & 계단
// ══════════════════════════════════════════════════
function checkWorld(){
  for(const it of items){
    if(it.got)continue;
    const pd=Math.hypot(it.x*TS+TS/2-px,it.y*TS+TS/2-pz);
    const vis=pd<TS*3||scannedTiles.has(`${it.x},${it.y}`);
    it.mesh.visible=vis; it.light.visible=vis;
    if(pd<TS*0.8){
      it.got=true; it.mesh.visible=false; it.light.visible=false; SFX.pick();
      if(it.type==='potion'){const h=10+floorN*2;P.hp=Math.min(P.maxHp,P.hp+h);msg('포션!  +'+h+' HP',{color:'#e91e63',dur:1800});}
      else{P.atk+=2;msg('유물 획득!  공격력 +2',{color:'#ffd700',dur:1800});}
      emitScan(6);
    }
  }
  if(Math.hypot(dungeon.stairX*TS+TS/2-px,dungeon.stairY*TS+TS/2-pz)<TS*0.8){
    floorN++; initGame({...P});
  }
}

// ══════════════════════════════════════════════════
// HUD
// ══════════════════════════════════════════════════
function updateHUD(){
  const hr=P.hp/P.maxHp;
  const hf=document.getElementById('bHP');
  hf.style.width=(hr*100)+'%';
  hf.style.background=hr>0.5?'#2e7d32':hr>0.25?'#ef6c00':'#b71c1c';
  document.getElementById('tHP').textContent=P.hp+'/'+P.maxHp;
  document.getElementById('bEX').style.width=(P.exp/P.expNext*100)+'%';
  document.getElementById('tST').textContent='Lv.'+P.lv+'  ATK '+P.atk+'  DEF '+P.def+'  G '+P.gold;
  document.getElementById('tFL').textContent='  B'+floorN+'F';
  const cd=document.getElementById('tCD');
  if(scanCD>0){cd.textContent='  재충전 '+(Math.ceil(scanCD/100)/10).toFixed(1)+'s';cd.style.color='#546e7a';}
  else{cd.textContent='  ● SPACE = 음파 스캔';cd.style.color='#00e5ff';}
}

// ══════════════════════════════════════════════════
// UI 유틸
// ══════════════════════════════════════════════════
function msg(text,{color='#00e5ff',dur=1800}={}){
  const el=document.createElement('div');
  el.className='gm'; el.style.color=color; el.textContent=text;
  document.getElementById('msgs').appendChild(el);
  setTimeout(()=>el.remove(),dur);
}
function dn(text,color){
  const el=document.createElement('div');
  el.className='dn'; el.style.color=color;
  el.style.left=(40+Math.random()*20)+'%'; el.style.top='43%';
  el.textContent=text; document.body.appendChild(el);
  let y=0,op=1;
  const step=()=>{y-=1.5;op-=0.025;el.style.transform='translateY('+y+'px)';el.style.opacity=op;if(op>0)requestAnimationFrame(step);else el.remove();};
  requestAnimationFrame(step);
}

// ══════════════════════════════════════════════════
// 게임 플로우
// ══════════════════════════════════════════════════
const ov=document.getElementById('ov');
function startGame(){
  ov.style.display='none'; GS='playing'; floorN=1;
  P={hp:30,maxHp:30,atk:6,def:1,lv:1,exp:0,expNext:10,gold:0};
  initGame();
}
function showGameOver(){
  ov.innerHTML='<h1 style="color:#b71c1c;font-size:34px;letter-spacing:4px">GAME OVER</h1><div class="ov-sub">B'+floorN+'F에서 쓰러졌습니다</div><div style="color:#263238;font-size:11px;margin-bottom:28px">메아리는 어둠 속으로 사라졌습니다...</div><div class="ov-btn" id="rb">[ ENTER 또는 클릭으로 재시작 ]</div>';
  ov.style.display='flex'; GS='gameover';
  document.getElementById('rb').addEventListener('click',startGame);
}
document.getElementById('obtn').addEventListener('click',startGame);
window.addEventListener('keydown',e=>{if(e.code==='Enter'&&(GS==='title'||GS==='gameover'))startGame();});

// ══════════════════════════════════════════════════
// 메인 루프
// ══════════════════════════════════════════════════
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-lastT)/1000,0.05); lastT=t;
  if(GS==='playing'){
    movePlayer(dt,t);
    updateScan(dt);
    updateEnemies(dt,t);
    checkWorld();
    updateHUD();
    drawMinimap();
    updateCompass();
    if(P.hp<=0){GS='dead';setTimeout(showGameOver,900);}
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
</script>
