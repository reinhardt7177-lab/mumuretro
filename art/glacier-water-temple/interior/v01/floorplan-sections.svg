 rx="12" fill="#15262e"/><text x="1165" y="151" font-size="22">3실 · 순환의 성소 · 22 × 24m</text><rect x="1203" y="232" width="374" height="408" fill="#34434a" stroke="#a8b7b9" stroke-width="3"/><rect x="1203" y="412.2" width="374" height="78.19999999999999" fill="#133e51"/><rect x="1366.2" y="412.2" width="47.599999999999994" height="78.19999999999999" fill="#76bdd0" opacity=".65"/><rect x="1260.8" y="403.7" width="20.4" height="95.19999999999999" fill="#c9b681" stroke="#efd483" stroke-dasharray="5 4"/><polyline points="1517.5,300 1560,300 1560,589 1254,589 1254,572 1305,572" fill="none" stroke="#b594d8" stroke-width="3" stroke-dasharray="7 5" /><polyline points="1305,572 1390,521 1390,453 1475,504 1475,555 1543,555 1543,300 1517.5,300 1390,300" fill="none" stroke="#2cbbc8" stroke-width="3"  marker-end="url(#flow)"/><polyline points="1390,623 1305,572 1390,521 1390,385 1517.5,385 1517.5,300" fill="none" stroke="#e1ac47" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#walk)"/><circle cx="1305" cy="572" r="9" fill="#247c94" stroke="#e6eff2"/><text class="label" x="1318" y="561">공급조 6</text><circle cx="1254" cy="572" r="9" fill="#99763e" stroke="#e6eff2"/><text class="label" x="1267" y="591">회수 펌프</text><circle cx="1390" cy="453" r="9" fill="#78cddd" stroke="#e6eff2"/><text class="label" x="1403" y="442">얼음길 4</text><circle cx="1390" cy="385" r="9" fill="#99763e" stroke="#e6eff2"/><text class="label" x="1403" y="404">착지·돌다리 잠금</text><circle cx="1475" cy="555" r="9" fill="#247c94" stroke="#e6eff2"/><text class="label" x="1488" y="544">가열 용기</text><circle cx="1517.5" cy="300" r="9" fill="#78cddd" stroke="#e6eff2"/><text class="label" x="1530.5" y="319">수문·집수판</text><circle cx="1390" cy="300" r="9" fill="#6d9370" stroke="#e6eff2"/><text class="label" x="1403" y="289">성소 목표 5</text><text x="1170" y="675" font-size="15">입구 Z=0 / 출구 +Z / 바닥 Y=0</text><text x="45" y="746" font-size="18" fill="#e1ac47">금색 점선: 플레이어 이동　청록: 물/증기 경로　보라 점선: 회수 배관　연갈색: 고정되는 복귀 다리</text><rect x="45" y="790" width="780" height="270" rx="12" fill="#15262e"/><text x="67" y="826" font-size="22">2실 단면 · 냉각판은 계단에서 접근</text><path d="M80 1010H790" stroke="#d6d1b4" stroke-width="5"/><text x="85" y="1040" font-size="15">기준 바닥 Y=0 · 기둥과 계단은 이 바닥에서 시작</text><path d="M225 1008L395 902H695" stroke="#b5b7a8" stroke-width="9" fill="none"/><text x="415" y="932" font-size="16">관리 회랑 Y=3.0 / 판 Y=5.0</text><rect x="120" y="970" width="70" height="37" fill="#247c94"/><path d="M155 970V855H605" fill="none" stroke="#b594d8" stroke-width="4"/><path d="M590 850l65 15" stroke="#7fe3ec" stroke-width="8"/><path d="M652 869V893" stroke="#2cbbc8" stroke-width="4" stroke-dasharray="4 4"/><text x="215" y="850" font-size="15">증기 관로 → 냉각판 → 물받이</text><rect x="865" y="790" width="780" height="270" rx="12" fill="#15262e"/><text x="887" y="826" font-size="22">3실 단면 · 먼저 위를 준비한 뒤 아래서 가열</text><path d="M900 1010H1610" stroke="#d6d1b4" stroke-width="5"/><text x="905" y="1040" font-size="15">기준 바닥 Y=0 · 기둥과 계단은 이 바닥에서 시작</text><path d="M1045 1008L1215 902H1515" stroke="#b5b7a8" stroke-width="9" fill="none"/><text x="1235" y="932" font-size="16">관리 회랑 Y=2.4 / 판 Y=4.6</text><rect x="940" y="970" width="70" height="37" fill="#247c94"/><path d="M975 970V855H1425" fill="none" stroke="#b594d8" stroke-width="4"/><path d="M1410 850l65 15" stroke="#7fe3ec" stroke-width="8"/><path d="M1472 869V893" stroke="#2cbbc8" stroke-width="4" stroke-dasharray="4 4"/><text x="1035" y="850" font-size="15">증기 관로 → 냉각판 → 물받이</text><text x="45" y="1110" font-size="21">제작 전 확인</text><text x="45" y="1150" font-size="17">① 점프 거리 실측으로 도랑 폭 확정　② 팔찌 사거리 6m·벽 가림 확인　③ 차가운 판은 준비 상태 유지</text><text x="45" y="1190" font-size="17">④ 회수 펌프는 공급조로만 연결　⑤ 고정 착지판이 복귀 다리를 잠금　⑥ 부분 얼음·추락·저장 복구 시험</text><text x="45" y="1240" font-size="16">도면의 선은 연결 관계를 표시합니다. 물·증기·보행의 실제 높이와 장치 크기는 다음 블록아웃에서 검증합니다.</text></svg>