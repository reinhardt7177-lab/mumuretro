<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720">
<rect width="1320" height="720" fill="#102936"/><style>text{font-family:system-ui,'Malgun Gothic',sans-serif;fill:#eef7f3} .title{font-size:25px;font-weight:700}.label{font-size:16px}.small{font-size:13px;fill:#b8d4d9}.room{fill:#203e4b;stroke:#8eaaa9;stroke-width:2}.water{fill:#469cb9;stroke:#b9f0f8;stroke-width:2}.stone{fill:#91aaa8;stroke:#d8e2cc;stroke-width:2}.route{fill:none;stroke:#d8bb73;stroke-width:3;stroke-dasharray:7 6}</style>
<text x="36" y="46" class="title">물의 신전 새 동선 설계 · Three.js</text><text x="36" y="75" class="small">입구는 아래 / 출구는 위 · 바닥 y=0 · 그림은 게임 구조를 설명하는 설계도이며 실제 화면이 아님</text>
<g transform="translate(35 105)"><rect class="room" width="390" height="460" rx="16"/><text x="20" y="38" class="title">1 · 물로 만든 발판</text><rect class="stone" x="152" y="75" width="112" height="72"/><text x="169" y="101" class="label" fill="#102936">출구 단</text><text x="175" y="126" class="small">1.55u</text><rect class="stone" x="38" y="155" width="65" height="55"/><text x="37" y="231" class="label">선택 보상</text><rect class="water" x="54" y="318" width="60" height="60"/><text x="51" y="403" class="label">물 → 얼음</text><path class="route" d="M114 345 Q196 330 205 187"/><rect class="water" x="178" y="160" width="55" height="55"/><text x="244" y="184" class="small">옮긴 얼음</text><text x="244" y="205" class="small">높이 0.78u</text><circle cx="195" cy="415" r="10" fill="#e0bf65"/><text x="216" y="421" class="label">팔찌</text><text x="21" y="447" class="small">얼리기만으로 문은 열리지 않는다.</text></g>
<g transform="translate(465 105)"><rect class="room" width="390" height="460" rx="16"/><text x="20" y="38" class="title">2 · 틈을 지나는 물</text><rect class="stone" x="154" y="75" width="104" height="40"/><text x="180" y="101" class="label">출구</text><rect class="water" x="61" y="132" width="52" height="66"/><text x="119" y="160" class="small">받이 / 부유 장치</text><rect class="stone" x="20" y="215" width="350" height="16"/><text x="266" y="212" class="small">좁은 배수구</text><rect class="stone" x="169" y="245" width="72" height="58"/><text x="183" y="276" class="label">승강대</text><rect class="stone" x="50" y="252" width="78" height="62"/><text x="52" y="273" class="small">위쪽 물길</text><text x="67" y="297" class="small">1.55u</text><path class="route" d="M88 278 L88 191"/><path class="route" d="M308 392 L180 392 L85 392 L85 322"/><rect class="water" x="281" y="367" width="54" height="42"/><text x="140" y="424" class="label">얼음으로 운반</text><text x="21" y="447" class="small">높은 곳에서 녹인 물이 받이로 흐른다.</text></g>
<g transform="translate(895 105)"><rect class="room" width="390" height="460" rx="16"/><text x="20" y="38" class="title">3 · 다시 쓰는 물</text><rect class="water" x="248" y="105" width="65" height="53"/><text x="235" y="184" class="label">높은 제단</text><path class="route" d="M281 154 L281 81 Q140 47 110 180"/><text x="185" y="82" class="small">기화 → 응결</text><rect class="water" x="78" y="191" width="65" height="51"/><text x="157" y="221" class="small">아래 회수 그릇</text><rect x="19" y="263" width="352" height="103" fill="#0a1725"/><rect class="water" x="166" y="254" width="60" height="122"/><text x="245" y="322" class="label">얼음 다리</text><rect class="stone" x="34" y="254" width="55" height="122"/><text x="24" y="399" class="small">건넌 뒤 열리는 돌다리</text><path class="route" d="M195 306 Q120 295 108 239"/><text x="21" y="447" class="small">다리로 쓴 물을 다시 녹여 제단에 보낸다.</text></g>
<text x="36" y="614" class="label">공통 조작: Q 데우기 · R 식히기 · E 들기/놓기 · Space 점프 · 모바일 동일 버튼</text><text x="36" y="648" class="small">모든 방에 같은 물의 규칙을 적용 · 제한 시간 없음 · 물 되돌리기와 단계별 힌트 제공 · 기존 완료·구슬 기록 보존</text><text x="36" y="683" class="small">제작 기준: reports/2026-10-02/WATER_ADVENTURE_BUILD.md / 새 퍼즐의 재미는 학생 플레이 검토가 필요</text></svg>