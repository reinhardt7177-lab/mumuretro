<main><h1>물의 팔찌</h1><p>기존 물방울 보석 시안을 바탕으로 만든 실제 웹 모델. 손목 크기의 팔찌를 확대해 살펴봅니다.</p>
<section id="stage"><canvas id="view"></canvas><span class="hint">드래그로 회전 · 휠로 확대</span><nav><button id="cool">차가운 물빛</button><button id="warm" class="warm">따뜻한 금빛</button><button id="front">정면 보기</button></nav></section>
<div class="grid"><figure><img src="/reports/2026-10-03/evidence/water-bracelet/cool-23.png" alt="실제 게임의 냉각 광선"><figcaption>실제 게임 · 손목에서 물로 이어지는 냉각 빛</figcaption></figure><figure><img src="/reports/2026-10-03/evidence/water-bracelet/03-heating.png" alt="실제 게임의 가열 광선"><figcaption>실제 게임 · 가열할 때의 따뜻한 금빛</figcaption></figure></div>

<script type="module">
import * as T from 'three';
import {buildWaterCuff} from '/src/render/WaterBraceletFx.js';
const stage=document.querySelector('#stage'),renderer=new T.WebGLRenderer({canvas:document.querySelector('#view'),alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(40,1,.001,10);camera.position.set(.11,.072,.245);camera.lookAt(0,0,0);
scene.add(new T.HemisphereLight(0xdaf5ff,0x283544,3));for(const [c,i,x,y,z] of [[0xffe0aa,5,-.3,.4,.3],[0xd1f3ff,3,.3,.1,-.3],[0xffffff,2,0,-.25,.2]]){const l=new T.DirectionalLight(c,i);l.position.set(x,y,z);scene.add(l);}
const cuff=buildWaterCuff();scene.add(cuff);let down=false,lastX=0,lastY=0,targetY=-.18,targetX=-.13,heat=false;
renderer.domElement.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;targetY+=(e.clientX-lastX)*.008;targetX+=(e.clientY-lastY)*.008;lastX=e.clientX;lastY=e.clientY;});renderer.domElement.addEventListener('pointerup',()=>down=false);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();camera.position.multiplyScalar(T.MathUtils.clamp(1+e.deltaY*.0007,.8,1.2));const d=camera.position.length();if(d<.13||d>.5)camera.position.setLength(T.MathUtils.clamp(d,.13,.5));},{passive:false});
document.querySelector('#cool').onclick=()=>heat=false;document.querySelector('#warm').onclick=()=>heat=true;document.querySelector('#front').onclick=()=>{targetX=targetY=0;camera.position.set(0,.015,.265);camera.lookAt(0,0,0);};
function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight,false);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(stage);resize();
function frame(){requestAnimationFrame(frame);cuff.rotation.y=T.MathUtils.lerp(cuff.rotation.y,targetY,.12);cuff.rotation.x=T.MathUtils.lerp(cuff.rotation.x,targetX,.12);cuff.userData.gem.material.emissive.setHex(heat?0xffb75c:0x29b6d1);cuff.userData.gem.material.emissiveIntensity=.35;renderer.render(scene,camera);}frame();window.braceletPreview={cuff,renderer,scene,camera};
</script></html>
