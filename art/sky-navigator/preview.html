<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하늘의 항해사 · 모델 검수</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#182731;color:#f5ead3;font:15px system-ui}canvas{display:block}header{position:fixed;top:22px;left:24px;pointer-events:none}h1{font-size:24px;margin:4px 0}p{color:#b9cbd1;font-size:13px}nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(580px,95%)}button{border:1px solid #ccac6877;background:#233d48;color:#fff0ce;border-radius:12px;padding:12px 18px;cursor:pointer}button[aria-pressed=true]{background:#826831}#status{max-width:85vw}a{color:#edc57e}</style>

<header><small>MUMU PLANET / CHARACTER WORKSHOP</small><h1>하늘의 항해사</h1><p>드래그로 회전 · 스크롤 또는 두 손가락으로 확대</p><p id="status">모델을 불러오는 중…</p></header>
<nav><button data-pose="idle">기본 자세</button><button data-pose="walk">걷기</button><button data-pose="run">달리기</button><button id="rear">뒷모습</button><button id="front">정면</button><button id="pause" aria-pressed="false">동작 멈추기</button></nav>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#182731');const camera=new T.PerspectiveCamera(32,innerWidth/innerHeight,.01,100);camera.position.set(0,.9,3.6);let yaw=0,pitch=.04,distance=3.6;const fingers=new Map(),canvas=renderer.domElement;canvas.style.touchAction='none';
const controls={update(){camera.position.set(Math.sin(yaw)*Math.cos(pitch)*distance,.8+Math.sin(pitch)*distance,Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(0,.8,0);}};
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);fingers.set(e.pointerId,[e.clientX,e.clientY]);};canvas.onpointermove=e=>{const old=fingers.get(e.pointerId);if(!old)return;const next=[e.clientX,e.clientY];if(fingers.size===2){const other=[...fingers].find(([id])=>id!==e.pointerId)[1];distance=Math.max(1,Math.min(7,distance+(Math.hypot(old[0]-other[0],old[1]-other[1])-Math.hypot(next[0]-other[0],next[1]-other[1]))*.01));}else{yaw-=(next[0]-old[0])*.008;pitch=Math.max(-.1,Math.min(.9,pitch+(next[1]-old[1])*.006));}fingers.set(e.pointerId,next);};for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,e=>fingers.delete(e.pointerId));canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(1,Math.min(7,distance+e.deltaY*.003));},{passive:false});
scene.add(new T.HemisphereLight(0xe5efff,0x615440,2));const key=new T.DirectionalLight(0xffefd4,3);key.position.set(3,5,4);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);const rim=new T.DirectionalLight(0x91caff,2);rim.position.set(-3,2,-2);scene.add(rim);
const floor=new T.Mesh(new T.CylinderGeometry(1,1,.06,80),new T.MeshStandardMaterial({color:0x344851,roughness:.8}));floor.position.y=-.035;floor.receiveShadow=true;scene.add(floor);
const loader=new GLTFLoader(),cache=new Map();let model,mixer,paused=false,request=0;const status=document.querySelector('#status');
async function show(pose){const ticket=++request;status.textContent='모델을 불러오는 중…';try{const filename={idle:'navigator-rigged-v01.glb',walk:'navigator-walking-v01.glb',run:'navigator-running-v01.glb'}[pose];let gltf=cache.get(pose);if(!gltf){gltf=await loader.loadAsync('source/'+filename);cache.set(pose,gltf);}if(ticket!==request)return;
if(model)scene.remove(model);model=gltf.scene;model.position.set(0,0,0);model.scale.setScalar(1);model.updateMatrixWorld(true);const box=new T.Box3().setFromObject(model),s=1.5/(box.max.y-box.min.y);model.scale.setScalar(s);model.position.set(-(box.min.x+box.max.x)*s/2,-box.min.y*s,-(box.min.z+box.max.z)*s/2);scene.add(model);let bones=0,meshes=0;model.traverse(o=>{if(o.isBone)bones++;if(o.isMesh){meshes++;o.castShadow=true;o.receiveShadow=true;for(const m of (Array.isArray(o.material)?o.material:[o.material])){m.emissive?.setHex(0);m.metalness=.05;m.roughness=.72;}}});mixer=new T.AnimationMixer(model);if(gltf.animations[0])mixer.clipAction(gltf.animations[0]).play();
status.textContent=`실제 GLB · ${bones}개 뼈 · ${meshes}개 메시 · ${gltf.animations.length}개 동작`;document.querySelectorAll('[data-pose]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pose===pose)));window.navigatorReview={model,mixer,scene,camera,renderer,pose,bones,meshes,clips:gltf.animations.map(a=>a.name)};
}catch(e){status.textContent='모델을 아직 불러올 수 없습니다. '+e.message;console.error(e);}}
document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>show(b.dataset.pose));document.querySelector('#rear').onclick=()=>{yaw=Math.PI;pitch=.04;};document.querySelector('#front').onclick=()=>{yaw=0;pitch=.04;};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.setAttribute('aria-pressed',String(paused));e.target.textContent=paused?'동작 재생':'동작 멈추기';};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});const clock=new T.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(.05,clock.getDelta());if(mixer&&!paused)mixer.update(dt);controls.update();renderer.render(scene,camera);});show('idle');
</script></html>
