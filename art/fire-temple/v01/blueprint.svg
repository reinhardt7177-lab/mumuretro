<text x="43" y="85" font-size="18" fill="#93bac7">V01 / 2026.10.20     정확한 제작 평면도 · 1칸=5m · 웹 Y↑ / 북쪽 −Z</text>
<rect x="25" y="113" width="355" height="940" rx="14" fill="#172a34" stroke="#465d68"/>
<text x="48" y="150" font-size="24" fill="#e9e4d4">게임의 흐름</text>
<rect x="44" y="167" width="317" height="116" rx="8" fill="#20343f" stroke="#465964"/>
<text x="58" y="192" font-size="21" fill="#ecc589">01 · 중앙 홀</text>
<text x="58" y="223" font-size="14" fill="#e9e4d4">먼저 목적지를 보고, 방을 하나씩 연다.</text>
<text x="58" y="249" font-size="14" fill="#e9e4d4">완료 표지는 중앙 홀에 계속 남는다.</text>
<text x="192" y="298" font-size="24" fill="#ecc589">↓</text>
<rect x="44" y="309" width="317" height="116" rx="8" fill="#20343f" stroke="#465964"/>
<text x="58" y="334" font-size="21" fill="#ecc589">02 · 균열 회랑</text>
<text x="58" y="365" font-size="14" fill="#e9e4d4">받침 두 개로 다리를 고정하고 시험한다.</text>
<text x="58" y="391" font-size="14" fill="#e9e4d4">흔들림이 멎은 다리를 직접 건너 잠근다.</text>
<text x="192" y="440" font-size="24" fill="#ecc589">↓</text>
<rect x="44" y="451" width="317" height="116" rx="8" fill="#20343f" stroke="#465964"/>
<text x="58" y="476" font-size="21" fill="#ecc589">03 · 용암 주조실</text>
<text x="58" y="507" font-size="14" fill="#e9e4d4">수로를 잇고 용암으로 빈 틀을 채운다.</text>
<text x="58" y="533" font-size="14" fill="#e9e4d4">흐름을 끊고 굳은 돌길을 건넌다.</text>
<text x="192" y="582" font-size="24" fill="#ecc589">↓</text>
<rect x="44" y="593" width="317" height="116" rx="8" fill="#20343f" stroke="#465964"/>
<text x="58" y="618" font-size="21" fill="#ecc589">04 · 증기 승강실</text>
<text x="58" y="649" font-size="14" fill="#e9e4d4">증기로 접근 다리를 내려 영구 고정한다.</text>
<text x="58" y="675" font-size="14" fill="#e9e4d4">동력을 승강기로 바꿔 탑승한 뒤 올라간다.</text>
<text x="192" y="724" font-size="24" fill="#ecc589">↓</text>
<rect x="44" y="735" width="317" height="116" rx="8" fill="#20343f" stroke="#465964"/>
<text x="58" y="760" font-size="21" fill="#ecc589">05 · 수호자의 전당</text>
<text x="58" y="791" font-size="14" fill="#e9e4d4">세 문양이 열린 상층 통로로 진입한다.</text>
<text x="58" y="817" font-size="14" fill="#e9e4d4">신과 대화 → 기록 → 바깥으로 자동 퇴장.</text>
<text x="48" y="951" font-size="18" fill="#a7d1cd">실패해도 해결한 부분은 보존</text>
<text x="48" y="980" font-size="14" fill="#e9e4d4">낙하 → 가까운 안전 발판에서 재시도</text>
<text x="48" y="1008" font-size="14" fill="#e9e4d4">대기·회전 중 저장 → 안정 상태로 복원</text>
