<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>무무 행성</title>
<meta name="description" content="구면 행성을 걷는 로우폴리 탐험 — 재설계 v2">
<style>
  /* 재설계 v2 — UI는 아직 없다. 지형·빛·대기가 실제로 되는지 보는 빌드다.
     상시 화면 규칙(상시 5개 · flex 컬럼 · 색 5계열)은 UI가 들어올 때 다시 적용한다. */
  :root{ --air:#c2dce6; --ink:#2a3a44; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--air);
    font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-user-select:none;user-select:none;}
  #c{display:block;width:100vw;height:100vh;touch-action:none;}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--air);color:var(--ink);font-size:15px;letter-spacing:3px;z-index:50;}
  /* 상호작용 프롬프트 — 화면에 겹치는 유일한 것. 나머지는 월드 안에 있다(§9). */
  #prompt{position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(10px);
    background:rgba(111,227,210,.92);color:#0d1519;font-size:15px;font-weight:700;
    letter-spacing:1px;padding:10px 24px;border-radius:22px;z-index:22;
    opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;
    box-shadow:0 4px 0 rgba(63,168,155,.9);}
  #prompt.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    background:rgba(40,70,80,.5);color:#fff;font-size:12px;padding:7px 16px;border-radius:18px;
    letter-spacing:1px;z-index:20;white-space:nowrap;
    animation:fade .5s ease-in 30s forwards;}
  @keyframes fade{to{opacity:0;visibility:hidden;}}
  @media (max-width:640px){#hint{font-size:11px;white-space:normal;text-align:center;
    left:14px;transform:none;max-width:264px;}}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="load">행성을 빚는 중…</div>
  <div id="prompt"></div>
  <div id="hint">WASD/방향키 이동 · 마우스 드래그 시점 · 휠 줌 · Shift 달리기 · Space 점프</div>

<!-- 모듈/런타임 오류를 로딩 화면에 스택과 함께 띄운다 -->
<script>
window.addEventListener('error',function(e){var el=document.getElementById('load');if(el){el.style.display='flex';el.style.color='#b00020';el.style.fontSize='12px';el.style.padding='24px';el.style.whiteSpace='pre-wrap';el.style.textAlign='left';el.style.lineHeight='1.5';el.style.alignItems='flex-start';el.textContent='⚠ 오류:\n'+(e.message||'')+'\n'+((e.error&&e.error.stack)||'')+'\n@'+(e.filename||'')+':'+(e.lineno||'');}console.error('CAUGHT',e.message,e.error&&e.error.stack);});
window.addEventListener('unhandledrejection',function(e){var el=document.getElementById('load');if(el){el.style.display='flex';el.style.color='#b00020';el.style.whiteSpace='pre-wrap';el.style.padding='24px';el.style.alignItems='flex-start';el.textContent='⚠ Promise 오류:\n'+(e.reason&&(e.reason.stack||e.reason.message)||e.reason);}});
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module" src="src/boot.js"></script>
</body>
</html>
